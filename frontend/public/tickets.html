<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./css/tickets.css">
    <link rel="shortcut icon" href="./assets/icons/bistech-icon.ico" type="image/x-icon">
    <title>Bisticket | Tickets</title>
</head>
<body>
    <main>
        <div class="content">
            <div class="sidebar">
                <div class="sidebar__title">
                    <h1 class="title inter-bold amber-selection"><span class="purple-text purple-selection" data-text="Bis">Bis</span><span class="amber-text" data-text="ticket"><i class="amber-selection">ticket</i></span></h1>
                </div>
                <div class="sidebar__buttons">
                    <button class="sidebar__buttons--button button-text pressed" data-role="suporte" data-page="dashboard">Dashboard</button>
                    <button class="sidebar__buttons--button button-text" data-role="suporte" data-page="myTickets">Tickets</button>
                    <button class="sidebar__buttons--button button-text" data-role="suporte" data-page="searchTickets">Pesquisar</button>
                    <button class="sidebar__buttons--button button-text" data-role="cliente" data-page="myTickets">Meus tickets</button>
                    <button class="sidebar__buttons--button button-text" data-role="cliente" data-page="createTicket">Criar ticket</button>
                </div>
                <div class="sidebar__options">
                    <button class="sidebar__buttons--exit-button button-text" data-page="exit">Sair</button>
                </div>
            </div>
            <div class="app__comments closed" id="app__comments"></div>
            <div class="app">
            </div>
        </div>
    </main>
    <script type="module" src="./js/tickets.js"></script>
</body>
</html>
